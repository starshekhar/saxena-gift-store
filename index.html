<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<title>Saxena Gift & Toys Store</title>
<style>
:root{--ink:#14122b;--bg:#e9e2ff;--card:#fff;--pink:#ff4fa3;--lemon:#ffe14d;--mint:#3de0b0;--blue:#3a5bff;--mut:#5b5878;--line:#14122b;--pri:#3a5bff;--acc:#ff4fa3;--yel:#ffe14d}
*{box-sizing:border-box}html,body{margin:0}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--bg) radial-gradient(#14122b26 1.5px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.4}
.disp,.chip,.pr b,.off,.fab,.tg,.closed h1,.sh h3{font-family:"Bagel Fat One","DM Sans",system-ui,sans-serif;font-weight:400}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mq{background:var(--ink);color:var(--lemon);overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:700}
.mqi{display:inline-block;animation:mq 26s linear infinite}
.mqi span{margin:0 14px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mqi{animation:none}}
.bs{padding:26px 16px 32px;border-bottom:3px solid var(--ink);background:radial-gradient(circle at 10% 22%,#ffe14d 0 7px,transparent 8px),radial-gradient(circle at 90% 30%,#3de0b0 0 9px,transparent 10px),radial-gradient(circle at 78% 88%,#fff 0 5px,transparent 6px),radial-gradient(circle at 20% 82%,#fff 0 4px,transparent 5px),linear-gradient(120deg,#3a5bff,#8a3dff 55%,#ff4fa3)}
.bn{width:100%;max-width:760px;margin:0 auto;display:block;border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);background:#fff}
.hero{background:var(--blue);color:#fff;padding:24px 16px;text-align:center;border-bottom:3px solid var(--ink)}
.hero h1{margin:0;font-size:clamp(28px,7vw,48px)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%}
.bar{margin-bottom:14px}
.bar input{box-shadow:4px 4px 0 var(--ink)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 12px 2px;margin-bottom:8px}
.chip{border:3px solid var(--ink);background:#fff;color:var(--ink);padding:8px 16px;border-radius:30px;white-space:nowrap;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-size:15px}
.chip.on{background:var(--pink);color:#fff;transform:translate(3px,3px);box-shadow:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.add{background:var(--lemon);color:var(--ink);font-size:14px}
.btn.red{background:var(--pink)}.btn.gr{background:var(--mint);color:var(--ink)}.btn.ghost{background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px 16px;padding:6px 4px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;border-bottom:3px solid var(--ink);border-radius:17px 17px 0 0;overflow:hidden;background:#ffd1e8}
.card:nth-child(4n+2) .ph{background:#fff2a8}.card:nth-child(4n+3) .ph{background:#c7f5e6}.card:nth-child(4n+4) .ph{background:#cfd8ff}
.ph img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:-12px;left:-10px;z-index:2;width:58px;height:58px;border-radius:50%;background:var(--lemon);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1;}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:800}.ct{font-size:12px;color:var(--mut)}
.pr b{font-size:22px;color:var(--ink)}.pr s{color:var(--mut);margin-left:6px;font-size:13px}
.pr em{display:block;font-style:normal;font-size:12px;font-weight:800;color:#0a8a63}
.row{display:flex;gap:6px;margin-top:auto;padding-top:4px}.row .btn{flex:1;padding:8px 6px}
.empty{grid-column:1/-1;text-align:center;padding:30px 10px;font-weight:700}
.adm{background:var(--lemon);color:var(--ink);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--ink)}
.adm b{flex:1;min-width:120px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border:3px solid #fff;border-radius:30px;padding:12px 20px;box-shadow:4px 4px 0 var(--pink);z-index:6;font-size:16px}
.ov{position:fixed;inset:0;background:#14122bb3;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;border:3px solid var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:22px;box-shadow:8px 8px 0 var(--pink)}}
.sh h3{margin:0;font-size:22px}.ci{display:flex;gap:8px;align-items:center;border-bottom:2px dashed var(--ink);padding:6px 0}
.ci .t{flex:1}.q{display:flex;gap:6px;align-items:center}.q button{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--lemon);color:var(--ink);font-weight:800}
.foot{text-align:center;background:var(--blue);color:#fff;border-top:3px solid var(--ink);margin-top:28px;padding:28px 14px 100px;font-size:14px}
.tg{font-size:22px;color:var(--lemon);margin-bottom:12px}
.closed{text-align:center;padding:80px 20px}.closed h1{font-size:34px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid var(--lemon);padding:10px 16px;border-radius:14px;z-index:30;max-width:90%;font-weight:700}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;border:3px solid var(--ink);border-radius:14px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px;font-weight:700}
</style>
</head>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Gifts','Toys & Games','Stationery','Wrapping'];
const EMO={'Gifts':'🎁','Toys & Games':'🧸','Stationery':'✏️','Wrapping':'🎀'};
const FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;
let db=null,auth=null,F={};
let cat='All',q='',cart=[],asVisitor=false,isAdmin=false,pimg=null;
try{cart=JSON.parse(localStorage.getItem('saxcart')||'[]')}catch(e){}
const fin=p=>Math.round(p.price*(100-(p.disc||0))/100);
const adm=()=>isAdmin&&!asVisitor;

document.getElementById('root').innerHTML='<div id="app"></div><div id="modal"></div>';
render();
async function initFB(){
  if(!FIREBASE_CONFIG)return;
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [a,fs,au]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
    const app=a.initializeApp(FIREBASE_CONFIG);
    db=fs.getFirestore(app);auth=au.getAuth(app);F={...fs,...au};
    F.onAuthStateChanged(auth,u=>{isAdmin=!!u;render()});
    F.onSnapshot(F.doc(db,'shop','settings'),d=>{if(d.exists()){const v=d.data();S.published=v.published!==false;S.shop={...S.shop,...(v.shop||{})};}render()});
    F.onSnapshot(F.collection(db,'products'),snap=>{S.products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.ts||0)-(x.ts||0));render()});
  }catch(e){toast('Could not connect to the database')}
}
initFB();

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function saveCart(){try{localStorage.setItem('saxcart',JSON.stringify(cart))}catch(e){}}
function mark(){dirty=true;render()}

function render(){
  const sh=S.shop,a=adm();
  if(!S.published&&!a){
    $('#app').innerHTML=`<div class="closed"><h1>${esc(sh.name)}</h1><p>The store is currently closed. Please check back soon 🙏</p></div>`;return;
  }
  const n=cart.reduce((s,c)=>s+c.q,0);
  $('#app').innerHTML=`
  ${isAdmin?`<div class="adm"><b>${asVisitor?'Visitor preview':'Admin mode • changes go live instantly'}</b>
    ${a?`<button class="btn" onclick="editP()">+ Product</button><button class="btn ghost" onclick="setts()">Shop Info</button>
    <button class="btn ${S.published?'red':'gr'}" onclick="togglePub()">${S.published?'Unpublish':'Publish ON'}</button>`:''}
    <button class="btn ghost" onclick="asVisitor=!asVisitor;render()">${asVisitor?'Back to Admin':'Visitor view'}</button>
    <button class="btn ghost" onclick="qrm()">QR Code</button>
    <button class="btn ghost" onclick="logout()">Logout</button></div>`:''}
  <div class="mq"><div class="mqi">${'<span>Gifts for every occasion ✦</span><span>Toys & games ✦</span><span>Wrapping services ✦</span><span>Gift happiness, spread smiles ✦</span>'.repeat(4)}</div></div>
  <div class="bs">${S.banner?`<img class="bn" src="${S.banner}" alt="${esc(sh.name)}">`:`<div class="hero"><h1>${esc(sh.name)}</h1></div>`}</div>
  <div class="wrap">
    <div class="bar"><input id="s" placeholder="Search gifts, toys, pens…" value="${esc(q)}" oninput="q=this.value;grid()"></div>
    <div class="chips">${['All',...CATS].map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c.replace(/'/g,'')}';render()">${EMO[c]||'✨'} ${c}</button>`).join('')}</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="foot"><div class="tg">${esc(sh.tagline)}</div>📍 ${esc(sh.address)}<br><br>
    <a class="btn" href="tel:${esc(sh.phone)}" style="text-decoration:none;display:inline-block">📞 ${esc(sh.phone)}</a>
    <a class="btn gr" href="https://wa.me/91${esc(sh.phone)}" style="text-decoration:none;display:inline-block">WhatsApp</a>${!isAdmin&&FIREBASE_CONFIG?'<br><br><a href="#" onclick="loginm();return false" style="color:#fff;opacity:.75;font-size:12px">Admin login</a>':''}</div>
  <button class="fab" onclick="cartm()">🛒 Cart (${n})</button>`;
  grid();
}

function grid(){
  const a=adm(),g=$('#grid');if(!g)return;
  const list=S.products.filter(p=>(cat=='All'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  g.innerHTML=list.length?list.map(p=>`<div class="card">
    ${p.disc>0?`<span class="off">${p.disc}%<br>OFF</span>`:''}
    <div class="ph">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:EMO[p.cat]||'🎁'}</div>
    <div class="bd"><div class="nm">${esc(p.name)}</div><div class="ct">${esc(p.cat)}</div>
      <div class="pr"><b>₹${fin(p)}</b>${p.disc>0?`<s>₹${p.price}</s>`:''}${p.disc>0?`<em>you save ₹${p.price-fin(p)}</em>`:''}</div>
      <div class="row"><button class="btn add" onclick="add('${p.id}')">Add to cart 🛒</button></div>
      ${a?`<div class="row"><button class="btn ghost" onclick="editP('${p.id}')">Edit</button><button class="btn red" onclick="delP('${p.id}')">Delete</button></div>`:''}
    </div></div>`).join(''):'<p class="empty">Nothing here yet. Try another vibe 🔍</p>';
}

function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});saveCart();render();toast('Added to cart ✅')}
function delP(id){if(!confirm('Delete this product?'))return;if(db)F.deleteDoc(F.doc(db,'products',id)).catch(()=>toast('Delete failed'));else S.products=S.products.filter(p=>p.id!=id);cart=cart.filter(c=>c.id!=id);saveCart();mark()}
function close_(){$('#modal').innerHTML=''}
function ov(inner){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)close_()"><div class="sh">${inner}</div></div>`}

function cartm(){
  const items=cart.map(c=>({c,p:S.products.find(p=>p.id==c.id)})).filter(x=>x.p);
  const tot=items.reduce((s,x)=>s+fin(x.p)*x.c.q,0);
  ov(`<h3>🛒 Your Cart</h3>${items.length?items.map(x=>`<div class="ci"><div class="t"><b>${esc(x.p.name)}</b><br>₹${fin(x.p)}</div>
    <div class="q"><button onclick="qty('${x.p.id}',-1)">−</button><b>${x.c.q}</b><button onclick="qty('${x.p.id}',1)">+</button></div></div>`).join('')
    +`<h3>Total: ₹${tot}</h3><div><label>Your name</label><input id="cn" placeholder="Name"></div>
    <button class="btn gr" onclick="order()">Send order on WhatsApp</button>
    <small style="color:var(--mut)">No online payment. Your order is sent to the shop on WhatsApp and you pay at the shop.</small>`
    :'<p>Your cart is empty.</p>'}<button class="btn ghost" onclick="close_()">Close</button>`);
}
function qty(id,d){const c=cart.find(x=>x.id==id);if(!c)return;c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);saveCart();render();cartm()}
function order(){
  const nm=($('#cn').value||'').trim();
  let t=`Hello ${S.shop.name},%0A${nm?'Name: '+encodeURIComponent(nm)+'%0A':''}I would like to order:%0A`,tot=0;
  cart.forEach(c=>{const p=S.products.find(p=>p.id==c.id);if(p){tot+=fin(p)*c.q;t+=encodeURIComponent(`${p.name} x ${c.q} = ₹${fin(p)*c.q}`)+'%0A'}});
  t+=encodeURIComponent('Total: ₹'+tot);
  window.open(`https://wa.me/91${S.shop.phone}?text=${t}`,'_blank');
}

function editP(id){
  const p=id?S.products.find(x=>x.id==id):{name:'',cat:CATS[0],price:'',disc:0,img:''};
  pimg=p.img||'';
  ov(`<h3>${id?'Edit product':'New product'}</h3>
  <div><label>Name</label><input id="en" value="${esc(p.name)}"></div>
  <div><label>Category</label><select id="ec">${CATS.map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label>Price (₹)</label><input id="ep" type="number" min="0" value="${p.price}"></div>
  <div><label>Discount (%)</label><input id="ed" type="number" min="0" max="100" value="${p.disc||0}"></div>
  <div><label>Photo (gallery / camera)</label><input id="ef" type="file" accept="image/*" onchange="pick(this)"></div>
  <div class="ph" id="pv" style="max-height:160px;border-radius:10px">${p.img?`<img src="${p.img}">`:'📷'}</div>
  <button class="btn red" onclick="pimg='';$('#pv').textContent='📷'">Remove photo</button>
  <button class="btn gr" onclick="saveP('${id||''}')">Save</button><button class="btn ghost" onclick="close_()">Cancel</button>`);
}
function pick(inp){
  const f=inp.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const m=700,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    pimg=c.toDataURL('image/jpeg',.78);$('#pv').innerHTML=`<img src="${pimg}">`;URL.revokeObjectURL(u)};
  im.src=u;
}
function saveP(id){
  const name=$('#en').value.trim(),price=+$('#ep').value;
  if(!name||!(price>=0)||$('#ep').value==='')return toast('Please enter name and price');
  const d={name,cat:$('#ec').value,price,disc:Math.min(100,Math.max(0,+$('#ed').value||0)),img:pimg};
  dbSet(id,d);close_();
}
function setts(){
  const s=S.shop;
  ov(`<h3>Shop Info</h3>
  <div><label>Shop name</label><input id="sn" value="${esc(s.name)}"></div>
  <div><label>Tagline</label><input id="st" value="${esc(s.tagline)}"></div>
  <div><label>Phone / WhatsApp (10 digit)</label><input id="sp" value="${esc(s.phone)}" inputmode="numeric"></div>
  <div><label>Address</label><textarea id="sa" rows="3">${esc(s.address)}</textarea></div>
  <div><label>Published website link (paste here for the QR code)</label><input id="sl" value="${esc(s.link)}" placeholder="https://..."></div>
  <button class="btn gr" onclick="saveS()">Save</button><button class="btn ghost" onclick="close_()">Cancel</button>`);
}
function saveS(){
  Object.assign(S.shop,{name:$('#sn').value.trim()||S.shop.name,tagline:$('#st').value.trim(),phone:$('#sp').value.replace(/\D/g,'').slice(-10),address:$('#sa').value.trim(),link:$('#sl').value.trim()});
  saveSettings();close_();mark();
}
function qrm(){
  const link=S.shop.link||location.href;
  ov(`<h3>Shop QR Code</h3><div id="qr"></div><small style="word-break:break-all;color:var(--mut)">${esc(link)}</small>
  <small>Scanning this opens the shop. Take a screenshot to print it.${S.shop.link?'':' For a correct QR, paste the published link in Shop Info.'}</small>
  <button class="btn ghost" onclick="close_()">Close</button>`);
  try{new QRCode($('#qr'),{text:link,width:220,height:220})}catch(e){$('#qr').textContent='Could not load QR'}
}
async function dbSet(id,d){
  if(!db)return toast('Database is not connected');
  try{id?await F.setDoc(F.doc(db,'products',id),d,{merge:true}):await F.addDoc(F.collection(db,'products'),{...d,ts:Date.now()})}
  catch(e){toast('Save failed: '+(e.code||'error'))}
}
function saveSettings(){if(db)F.setDoc(F.doc(db,'shop','settings'),{published:S.published,shop:S.shop},{merge:true}).catch(()=>toast('Save failed'))}
function togglePub(){S.published=!S.published;saveSettings();render()}
function loginm(){ov(`<h3>Admin login</h3><div><label>Email</label><input id="le" type="email"></div><div><label>Password</label><input id="lp" type="password"></div><button class="btn gr" onclick="login()">Login</button><button class="btn ghost" onclick="close_()">Cancel</button>`)}
async function login(){try{await F.signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value);close_()}catch(e){toast('Login failed: wrong email or password')}}
function logout(){F.signOut(auth)}
</script>
</body>
</html>
