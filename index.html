<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saxena Gift & Toys Store</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#1b2250;--mut:#6b7190;--pri:#1d3fbf;--acc:#e5173f;--yel:#ffc928;--line:#e8e3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142b;--card:#1a1f3d;--ink:#f1f2fb;--mut:#a0a6c8;--pri:#7d98ff;--line:#2d335a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10142b;--card:#1a1f3d;--ink:#f1f2fb;--mut:#a0a6c8;--pri:#7d98ff;--line:#2d335a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.hero{background:linear-gradient(135deg,#1d3fbf,#0f2380);color:#fff;padding:22px 16px;text-align:center;border-bottom:5px solid var(--yel)}
.hero h1{margin:0;font-size:clamp(28px,7vw,48px);font-weight:900;letter-spacing:.5px}
.hero .sub{display:inline-block;margin:8px 0;background:var(--acc);padding:6px 18px;border-radius:30px;font-weight:800}
.hero p{margin:4px 0;font-style:italic;color:#ffe9a6}
.svc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.svc span{padding:6px 12px;border-radius:14px;font-size:13px;font-weight:700;color:#fff}
.bn{width:100%;display:block;border-bottom:5px solid var(--yel)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.bar input{flex:1;min-width:160px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.btn.red{background:var(--acc)}.btn.gr{background:#1f9d55}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:1;background:#fdeccb;display:flex;align-items:center;justify-content:center;font-size:64px}
.ph img{width:100%;height:100%;object-fit:cover}
.bd{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:700}.ct{font-size:12px;color:var(--mut)}
.pr b{font-size:18px;color:var(--acc)}.pr s{color:var(--mut);margin-left:6px;font-size:13px}
.off{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.row{display:flex;gap:6px;margin-top:auto}.row .btn{flex:1;padding:8px 6px}
.adm{background:#fff3c4;color:#4a3b00;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.adm b{flex:1;min-width:120px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:30px;padding:13px 20px;font-weight:800;box-shadow:0 4px 14px #0004;z-index:6}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:18px}}
.sh h3{margin:0}.ci{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.ci .t{flex:1}.q{display:flex;gap:6px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.foot{text-align:center;padding:20px 14px 90px;color:var(--mut);font-size:14px}
.closed{text-align:center;padding:80px 20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
</style>
</head>

  ${isAdmin?`<div class="adm"><b>${asVisitor?'Visitor preview':'Admin mode'}${dirty?' • ⚠ Unsaved changes':''}</b>
    ${a?`<button class="btn" onclick="editP()">+ Product</button><button class="btn ghost" onclick="setts()">Shop Info</button>
    <button class="btn ${S.published?'red':'gr'}" onclick="S.published=!S.published;mark()">${S.published?'Unpublish':'Publish ON'}</button>`:''}
    <button class="btn ghost" onclick="asVisitor=!asVisitor;render()">${asVisitor?'Back to Admin':'Visitor view'}</button>
    <button class="btn ghost" onclick="qrm()">QR Code</button>
    <button class="btn gr" onclick="pub()">Save & Publish</button></div>`:''}
  ${S.banner?`<img class="bn" src="${S.banner}" alt="${esc(sh.name)}">`:`<div class="hero"><h1>${esc(sh.name)}</h1></div>`}
  <div class="wrap">
    <div class="bar"><input id="s" placeholder="🔍 Search products" value="${esc(q)}" oninput="q=this.value;grid()"></div>
    <div class="chips">${['All',...CATS].map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c.replace(/'/g,'')}';render()">${c}</button>`).join('')}</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="foot">📍 ${esc(sh.address)}<br><br>
    <a class="btn" href="tel:${esc(sh.phone)}" style="text-decoration:none;display:inline-block">📞 ${esc(sh.phone)}</a>
    <a class="btn gr" href="https://wa.me/91${esc(sh.phone)}" style="text-decoration:none;display:inline-block">WhatsApp</a></div>
  <button class="fab" onclick="cartm()">🛒 Cart (${n})</button>`;
  grid();
}

function grid(){
  const a=adm(),g=$('#grid');if(!g)return;
  const list=S.products.filter(p=>(cat=='All'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  g.innerHTML=list.length?list.map(p=>`<div class="card">
    ${p.disc>0?`<span class="off">${p.disc}% OFF</span>`:''}
    <div class="ph">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:EMO[p.cat]||'🎁'}</div>
    <div class="bd"><div class="nm">${esc(p.name)}</div><div class="ct">${esc(p.cat)}</div>
      <div class="pr"><b>₹${fin(p)}</b>${p.disc>0?`<s>₹${p.price}</s>`:''}</div>
      <div class="row"><button class="btn" onclick="add('${p.id}')">Add to cart</button></div>
      ${a?`<div class="row"><button class="btn ghost" onclick="editP('${p.id}')">Edit</button><button class="btn red" onclick="delP('${p.id}')">Delete</button></div>`:''}
    </div></div>`).join(''):'<p>No products found.</p>';
}

function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});saveCart();render();toast('Added to cart ✅')}
function delP(id){if(!confirm('Delete this product?'))return;S.products=S.products.filter(p=>p.id!=id);cart=cart.filter(c=>c.id!=id);saveCart();mark()}
function close_(){$('#modal').innerHTML=''}
function ov(inner){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)close_()"><div class="sh">${inner}</div></div>`}

function cartm(){
  const items=cart.map(c=>({c,p:S.products.find(p=>p.id==c.id)})).filter(x=>x.p);
  const tot=items.reduce((s,x)=>s+fin(x.p)*x.c.q,0);
  ov(`<h3>🛒 Your Cart</h3>${items.length?items.map(x=>`<div class="ci"><div class="t"><b>${esc(x.p.name)}</b><br>₹${fin(x.p)}</div>
    <div class="q"><button onclick="qty('${x.p.id}',-1)">−</button><b>${x.c.q}</b><button onclick="qty('${x.p.id}',1)">+</button></div></div>`).join('')
    +`<h3>Total: ₹${tot}</h3><div><label>Your name</label><input id="cn" placeholder="Name"></div>
    <button class="btn gr" onclick="order()">Send order on WhatsApp</button>
    <small style="color:var(--mut)">No online payment. Your order is sent to the shop on WhatsApp and you pay at the shop.</small>`
    :'<p>Your cart is empty.</p>'}<button class="btn ghost" onclick="close_()">Close</button>`);
}
function qty(id,d){const c=cart.find(x=>x.id==id);if(!c)return;c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);saveCart();render();cartm()}
function order(){
  const nm=($('#cn').value||'').trim();
  let t=`Hello ${S.shop.name},%0A${nm?'Name: '+encodeURIComponent(nm)+'%0A':''}I would like to order:%0A`,tot=0;
  cart.forEach(c=>{const p=S.products.find(p=>p.id==c.id);if(p){tot+=fin(p)*c.q;t+=encodeURIComponent(`${p.name} x ${c.q} = ₹${fin(p)*c.q}`)+'%0A'}});
  t+=encodeURIComponent('Total: ₹'+tot);
  window.open(`https://wa.me/91${S.shop.phone}?text=${t}`,'_blank');
}

function editP(id){
  const p=id?S.products.find(x=>x.id==id):{name:'',cat:CATS[0],price:'',disc:0,img:''};
  pimg=p.img||'';
  ov(`<h3>${id?'Edit product':'New product'}</h3>
  <div><label>Name</label><input id="en" value="${esc(p.name)}"></div>
  <div><label>Category</label><select id="ec">${CATS.map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label>Price (₹)</label><input id="ep" type="number" min="0" value="${p.price}"></div>
  <div><label>Discount (%)</label><input id="ed" type="number" min="0" max="100" value="${p.disc||0}"></div>
  <div><label>Photo (gallery / camera)</label><input id="ef" type="file" accept="image/*" onchange="pick(this)"></div>
  <div class="ph" id="pv" style="max-height:160px;border-radius:10px">${p.img?`<img src="${p.img}">`:'📷'}</div>
  <button class="btn red" onclick="pimg='';$('#pv').textContent='📷'">Remove photo</button>
  <button class="btn gr" onclick="saveP('${id||''}')">Save</button><button class="btn ghost" onclick="close_()">Cancel</button>`);
}
function pick(inp){
  const f=inp.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const m=700,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    pimg=c.toDataURL('image/jpeg',.78);$('#pv').innerHTML=`<img src="${pimg}">`;URL.revokeObjectURL(u)};
  im.src=u;
}
function saveP(id){
  const name=$('#en').value.trim(),price=+$('#ep').value;
  if(!name||!(price>=0)||$('#ep').value==='')return toast('Please enter name and price');
  const d={name,cat:$('#ec').value,price,disc:Math.min(100,Math.max(0,+$('#ed').value||0)),img:pimg};
  if(id)Object.assign(S.products.find(p=>p.id==id),d);else S.products.unshift({id:'p'+Date.now(),...d});
  close_();mark();
}
function setts(){
  const s=S.shop;
  ov(`<h3>Shop Info</h3>
  <div><label>Shop name</label><input id="sn" value="${esc(s.name)}"></div>
  <div><label>Tagline</label><input id="st" value="${esc(s.tagline)}"></div>
  <div><label>Phone / WhatsApp (10 digit)</label><input id="sp" value="${esc(s.phone)}" inputmode="numeric"></div>
  <div><label>Address</label><textarea id="sa" rows="3">${esc(s.address)}</textarea></div>
  <div><label>Published website link (paste here for the QR code)</label><input id="sl" value="${esc(s.link)}" placeholder="https://..."></div>
  <button class="btn gr" onclick="saveS()">Save</button><button class="btn ghost" onclick="close_()">Cancel</button>`);
}
function saveS(){
  Object.assign(S.shop,{name:$('#sn').value.trim()||S.shop.name,tagline:$('#st').value.trim(),phone:$('#sp').value.replace(/\D/g,'').slice(-10),address:$('#sa').value.trim(),link:$('#sl').value.trim()});
  close_();mark();
}
function qrm(){
  const link=S.shop.link||location.href;
  ov(`<h3>Shop QR Code</h3><div id="qr"></div><small style="word-break:break-all;color:var(--mut)">${esc(link)}</small>
  <small>Scanning this opens the shop. Take a screenshot to print it.${S.shop.link?'':' For a correct QR, paste the published link in Shop Info.'}</small>
  <button class="btn ghost" onclick="close_()">Close</button>`);
  try{new QRCode($('#qr'),{text:link,width:220,height:220})}catch(e){$('#qr').textContent='Could not load QR'}
}
async function pub(){
  if(!art)return toast('Admin login is required to publish');
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#root').innerHTML='';
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  try{await art.publish('<!doctype html>\n'+c.outerHTML)}
  catch(e){toast('Publish failed: '+((e&&e.code)||'error'))}
}
</script>
</body>
</html>
